# Specifies which slug should gain the "latest" tags
latest: 4.7.0.1

# Sets the alpine image tag for the downloader stage
downloaderTag: 3.24.1

uid: 1000
gid: 1000

# Add OCI best-practice labels https://github.com/opencontainers/image-spec/blob/main/annotations.md#pre-defined-annotation-keys
labels: |-
  "org.opencontainers.image.authors"="NovaMap Health" \
  "org.opencontainers.image.created"="${CREATED_AT?:}" \
  "org.opencontainers.image.description"="An open source fork of the now closed-source Mirth Connect." \
  "org.opencontainers.image.licenses"="MPL-2.0" \
  "org.opencontainers.image.source"="https://github.com/NovaMap-Health/engine-docker" \
  "org.opencontainers.image.title"="Eclipse Open Integration Engine - NovaMap Edition" \
  "org.opencontainers.image.url"="https://github.com/NovaMap-Health/engine" \
  "org.opencontainers.image.vendor"="NovaMap Health" \
  "org.opencontainers.image.version"="{{ .slug }}"

versions:
  - slug: 4.7.0.1
    releaseVersion: 4.7.0.1
    releaseUrl: https://github.com/NovaMap-Health/engine/releases/download/v4.7.0.1/oie-nova_unix_4_7_0_1.tar.gz
    tags:
      - distro: ubuntu
        type: jre
        tag: 21.0.11_10-jre-resolute
      - distro: ubuntu
        type: jdk
        tag: 21.0.11_10-jdk-resolute
      - distro: alpine
        type: jre
        tag: 21.0.11_10-jre-alpine
      - distro: alpine
        type: jdk
        tag: 21.0.11_10-jdk-alpine
